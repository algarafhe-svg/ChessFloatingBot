
name: Build Chess Stockfish APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChessFloatingBot_External_Stockfish_Button.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f ChessFloatingBot_External_Stockfish_Button.zip
          unzip -o ChessFloatingBot_External_Stockfish_Button.zip -d .
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Download Stockfish Android engines
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          curl -fL --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-armv8.tar \
            -o /tmp/sf-arm64.tar

          curl -fL --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-armv7-neon.tar \
            -o /tmp/sf-armv7.tar

          tar -xf /tmp/sf-arm64.tar -C /tmp
          tar -xf /tmp/sf-armv7.tar -C /tmp

          ARM64=$(find /tmp -type f -name stockfish-android-armv8 | head -n 1)
          ARMV7=$(find /tmp -type f -name stockfish-android-armv7-neon | head -n 1)

          test -n "$ARM64"
          test -n "$ARMV7"

          install -m 755 "$ARM64" app/src/main/jniLibs/arm64-v8a/libstockfish.so
          install -m 755 "$ARMV7" app/src/main/jniLibs/armeabi-v7a/libstockfish.so

      - name: Build and test APK
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: ChessStockfish-Android-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
