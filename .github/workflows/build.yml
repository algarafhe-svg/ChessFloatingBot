
name: Build Chess Stockfish APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChessFloatingBot_External_Stockfish_Button.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -e
          test -f ChessFloatingBot_External_Stockfish_Button.zip
          unzip -o ChessFloatingBot_External_Stockfish_Button.zip -d .
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Download and install Stockfish
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/official-stockfish/Stockfish/releases/latest/download"

          mkdir -p /tmp/sf64 /tmp/sf32
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          curl -fL --retry 3 \
            "$BASE/stockfish-android-arm64-universal.tar.gz" \
            -o /tmp/sf64.tar.gz

          curl -fL --retry 3 \
            "$BASE/stockfish-android-armv7-neon.tar.gz" \
            -o /tmp/sf32.tar.gz

          tar -xzf /tmp/sf64.tar.gz -C /tmp/sf64
          tar -xzf /tmp/sf32.tar.gz -C /tmp/sf32

          ARM64=""

          while IFS= read -r -d '' f; do
            DESC="$(file -b "$f" || true)"
            if [[ "$DESC" == *"ELF 64-bit"* && "$DESC" == *"ARM aarch64"* ]]; then
              ARM64="$f"
              break
            fi
          done < <(find /tmp/sf64 -type f -print0)

          ARMV7=""

          while IFS= read -r -d '' f; do
            DESC="$(file -b "$f" || true)"
            if [[ "$DESC" == *"ELF 32-bit"* && "$DESC" == *"ARM"* ]]; then
              ARMV7="$f"
              break
            fi
          done < <(find /tmp/sf32 -type f -print0)

          if [[ -z "$ARM64" ]]; then
            echo "ERROR: ARM64 Stockfish executable not found"
            find /tmp/sf64 -type f
            exit 1
          fi

          if [[ -z "$ARMV7" ]]; then
            echo "ERROR: ARMv7 Stockfish executable not found"
            find /tmp/sf32 -type f
            exit 1
          fi

          install -m 755 "$ARM64" \
            app/src/main/jniLibs/arm64-v8a/libstockfish.so

          install -m 755 "$ARMV7" \
            app/src/main/jniLibs/armeabi-v7a/libstockfish.so

          echo "Both Stockfish engines installed successfully."

      - name: Build and test APK
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: ChessStockfish-Android-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
