
name: Build Chess Stockfish APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChessFloatingBot_External_Stockfish_Button.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -euo pipefail
          test -f ChessFloatingBot_External_Stockfish_Button.zip
          unzip -o ChessFloatingBot_External_Stockfish_Button.zip -d .
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Download Stockfish Android engines
        run: |
          set -euo pipefail

          mkdir -p /tmp/sf-arm64 /tmp/sf-armv7
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          BASE="https://github.com/official-stockfish/Stockfish/releases/latest/download"

          curl -fL --retry 3 \
            "$BASE/stockfish-android-arm64-universal.tar.gz" \
            -o /tmp/sf-arm64.tar.gz

          curl -fL --retry 3 \
            "$BASE/stockfish-android-armv7-neon.tar.gz" \
            -o /tmp/sf-armv7.tar.gz

          tar -xzf /tmp/sf-arm64.tar.gz -C /tmp/sf-arm64
          tar -xzf /tmp/sf-armv7.tar.gz -C /tmp/sf-armv7

          ARM64=$(find /tmp/sf-arm64 -type f -print0 | xargs -0 file | awk -F: '/ELF 64-bit.*(ARM aarch64|AArch64)/ {print $1; exit}')
          ARMV7=$(find /tmp/sf-armv7 -type f -print0 | xargs -0 file | awk -F: '/ELF 32-bit.*ARM/ {print $1; exit}')

          test -n "$ARM64" || { echo "ARM64 engine not found"; exit 1; }
          test -n "$ARMV7" || { echo "ARMv7 engine not found"; exit 1; }

          install -m 755 "$ARM64" app/src/main/jniLibs/arm64-v8a/libstockfish.so
          install -m 755 "$ARMV7" app/src/main/jniLibs/armeabi-v7a/libstockfish.so

          echo "Stockfish Android engines installed successfully."

      - name: Build and test APK
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: ChessStockfish-Android-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
